name: Examples

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch a dependency release that breaks an example
  workflow_dispatch:

env:
  SENDPOSITORY_API_KEY: sp_test_key
  SENDPOSITORY_FROM: "Acme <hello@verified.test>"
  SENDPOSITORY_BASE_URL: http://localhost:4010/v1

# Read-only: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: node .github/ci/mock-api.mjs & sleep 1
      - working-directory: node
        run: |
          npm ci
          touch .env
          ../.github/ci/expect.sh npm run -s send --

  nextjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - working-directory: nextjs
        run: |
          npm ci
          npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: node .github/ci/mock-api.mjs & sleep 1
      - working-directory: python
        run: ../.github/ci/expect.sh python send.py

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with: { php-version: "8.1", extensions: curl }
      - run: node .github/ci/mock-api.mjs & sleep 1
      - working-directory: php
        run: |
          php -l send.php
          ../.github/ci/expect.sh php send.php

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.22" }
      - run: node .github/ci/mock-api.mjs & sleep 1
      - working-directory: go
        run: |
          go vet ./...
          ../.github/ci/expect.sh go run .
